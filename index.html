<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cash Bonus Giveaway</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 20%,#2636a8 0,transparent 25%),
    radial-gradient(circle at 90% 70%,#7b147f 0,transparent 30%),
    linear-gradient(135deg,#03051c,#08002d 45%,#02091e);
}

/* BACKGROUND LIGHTS */

body:before,
body:after{
  content:"";
  position:fixed;
  width:320px;
  height:320px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.35;
  z-index:-2;
  animation:orb 8s infinite alternate ease-in-out;
}

body:before{
  background:#006eff;
  top:-100px;
  left:-80px;
}

body:after{
  background:#ff00d4;
  right:-100px;
  bottom:-100px;
  animation-delay:2s;
}

@keyframes orb{
  from{
    transform:translate(0,0);
  }
  to{
    transform:translate(60px,-40px);
  }
}

/* MAIN */

.page{
  width:100%;
  max-width:1250px;
  margin:auto;
  padding:25px 20px 35px;
}

/* TITLE */

.title{
  text-align:center;
  position:relative;
  z-index:5;
}

.money{
  font-size:58px;
  filter:drop-shadow(0 0 15px #48ff72);
  vertical-align:middle;
}

.title h1{
  display:inline-block;
  margin:0;
  font-size:clamp(38px,7vw,82px);
  line-height:.9;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:
    0 4px 0 #555,
    0 0 20px rgba(255,255,255,.5);
}

.title h1 span{
  display:block;
  color:#00eaff;
  font-size:.9em;
  text-shadow:
    0 0 8px #00eaff,
    0 0 25px #008cff;
  transform:skew(-8deg);
}

.demo{
  margin:20px 0 15px;
  color:#ffc928;
  font-size:25px;
  font-weight:900;
  text-shadow:0 0 12px #ff9d00;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:18px;
  padding:13px 22px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:40px;
  background:rgba(0,0,0,.35);
  box-shadow:
    inset 0 0 20px rgba(255,255,255,.05),
    0 0 25px rgba(0,150,255,.12);
  font-size:16px;
}

.green-dot{
  width:11px;
  height:11px;
  display:inline-block;
  border-radius:50%;
  background:#00ff72;
  box-shadow:0 0 15px #00ff72;
}

/* HERO */

.hero{
  position:relative;
  min-height:780px;
  margin-top:10px;
}

/* FLOOR */

.floor{
  position:absolute;
  left:4%;
  right:4%;
  bottom:5px;
  height:80px;
  border-radius:50%;
  background:
    radial-gradient(ellipse,
      rgba(0,211,255,.35),
      rgba(107,0,255,.18) 35%,
      transparent 70%);
  filter:blur(8px);
}

/* CHARACTER */

.character{
  position:absolute;
  left:1%;
  bottom:20px;
  width:47%;
  height:720px;
  min-width:350px;
  z-index:4;
  animation:characterFloat 4s ease-in-out infinite;
}

@keyframes characterFloat{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-7px);
  }
}

.character svg{
  width:100%;
  height:100%;
  overflow:visible;
}

/* JACKET GLOW */

.jacketGlow{
  filter:
    drop-shadow(0 0 8px rgba(0,180,255,.4))
    drop-shadow(0 0 25px rgba(120,0,255,.2));
}

/* OFFERS AREA */

.coatOffers{
  position:absolute;
  z-index:8;
  width:46%;
  right:4%;
  top:145px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* OFFER */

.offer{
  min-height:135px;
  padding:17px 20px;
  border-radius:18px;

  display:grid;
  grid-template-columns:75px 1fr;
  align-items:center;
  gap:15px;

  background:
    linear-gradient(135deg,
      rgba(0,0,0,.82),
      rgba(4,25,36,.72));

  border:1px solid rgba(255,255,255,.25);

  box-shadow:
    inset 0 0 25px rgba(255,255,255,.04),
    0 8px 35px rgba(0,0,0,.45);

  backdrop-filter:blur(5px);

  animation:offerFloat 3s ease-in-out infinite;
}

.offer:nth-child(2){
  animation-delay:.35s;
}

.offer:nth-child(3){
  animation-delay:.7s;
}

@keyframes offerFloat{
  0%,100%{
    transform:translateX(0);
  }
  50%{
    transform:translateX(4px);
  }
}

.offer.green{
  border-color:#53ff72;
  box-shadow:
    0 0 20px rgba(30,255,80,.15),
    inset 0 0 25px rgba(30,255,80,.06);
}

.offer.blue{
  border-color:#00c8ff;
  box-shadow:
    0 0 20px rgba(0,200,255,.15),
    inset 0 0 25px rgba(0,200,255,.06);
}

.offer.orange{
  border-color:#ffae2f;
  box-shadow:
    0 0 20px rgba(255,160,20,.15),
    inset 0 0 25px rgba(255,160,20,.06);
}

.cashIcon{
  font-size:45px;
  filter:drop-shadow(0 0 8px rgba(80,255,80,.5));
}

.offerText{
  text-align:left;
}

.amount{
  font-size:40px;
  line-height:1;
  font-weight:900;
}

.green .amount{
  color:#58ff6c;
  text-shadow:0 0 15px #1dff45;
}

.blue .amount{
  color:#22d8ff;
  text-shadow:0 0 15px #00aaff;
}

.orange .amount{
  color:#ffb52e;
  text-shadow:0 0 15px #ff8c00;
}

.bonus{
  font-size:17px;
  font-weight:800;
  margin-left:8px;
}

.offer p{
  margin:8px 0 12px;
  font-size:14px;
  color:#ddd;
}

.get{
  border:0;
  border-radius:25px;
  padding:10px 28px;
  color:white;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  transition:.25s;
}

.green .get{
  background:#18d957;
  box-shadow:0 0 15px rgba(24,217,87,.5);
}

.blue .get{
  background:#079ee8;
  box-shadow:0 0 15px rgba(0,170,255,.5);
}

.orange .get{
  background:#ff9200;
  box-shadow:0 0 15px rgba(255,150,0,.5);
}

.get:hover{
  transform:scale(1.07);
  filter:brightness(1.2);
}

/* BOTTOM */

.bottom{
  position:relative;
  z-index:10;
  text-align:center;
  margin-top:-15px;
  font-size:15px;
  color:#ddd;
}

.features{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:25px;
  margin-bottom:14px;
}

.thanks{
  font-size:18px;
  font-weight:700;
}

.heart{
  color:#ff334f;
  text-shadow:0 0 10px #ff0033;
}

/* MESSAGE */

#message{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:100;
  display:none;

  background:rgba(0,0,0,.9);
  border:1px solid #00d9ff;
  border-radius:15px;

  padding:15px 25px;

  box-shadow:0 0 25px rgba(0,200,255,.4);

  font-weight:700;
}

/* MOBILE */

@media(max-width:850px){

  .page{
    padding:20px 10px 30px;
  }

  .money{
    font-size:40px;
  }

  .title h1{
    font-size:43px;
  }

  .status{
    font-size:13px;
    gap:9px;
    padding:10px 13px;
  }

  .hero{
    min-height:1100px;
  }

  .character{
    width:100%;
    height:610px;
    left:-2%;
    bottom:420px;
    min-width:0;
  }

  .coatOffers{
    width:88%;
    right:6%;
    top:500px;
  }

  .offer{
    min-height:125px;
  }

  .amount{
    font-size:32px;
  }

  .bonus{
    display:block;
    margin:5px 0 0;
  }

  .cashIcon{
    font-size:38px;
  }

}

@media(max-width:450px){

  .title h1{
    font-size:34px;
  }

  .demo{
    font-size:20px;
  }

  .hero{
    min-height:1010px;
  }

  .character{
    height:500px;
    bottom:430px;
  }

    top:405px;
    width:94%;

  }

  .offer{

  .cashIcon{

  }

  .amount{
    font-size:28px;
  }

  .bonus{
    font-size:13px;
  }

  .offer p{
    font-size:12px;
  }

  .get{
    padding:8px 20px;
    font-size:13px;
  }
}
</style>
</head>

<script>

/* BONUS BUTTON */

function selectBonus(amount){

  const message =
    document.getElementById("message");

  message.textContent =
    "You selected the $" +
    amount +
    " bonus.";

  message.style.display = "block";

  setTimeout(function(){

    message.style.display = "none";

  },2500);

}


/* ONLINE USERS DEMO */

let online = 125;

setInterval(function(){

  const change =
    Math.random() > .5 ? 1 : -1;

  online += change;

  if(online < 100){
    online = 100;
  }

  document.getElementById(
    "online"
  ).textContent = online;

},3000);

</script>
