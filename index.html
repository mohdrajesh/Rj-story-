<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cash Bonus Giveaway</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #02030b;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* =========================================
           MAIN WEBSITE
        ========================================= */

        .website {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            background:
                radial-gradient(
                    circle at center,
                    #080b24 0%,
                    #02030b 70%
                );

            padding: 0;
        }


        /* =========================================
           POSTER
        ========================================= */

        .poster {
            position: relative;

            width: 100%;
            max-width: 1024px;

            aspect-ratio: 1024 / 1536;

            overflow: hidden;

            background: #030615;
        }


        /* EXACT DESIGN IMAGE */

        .poster-image {
            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            object-fit: cover;

            user-select: none;
            -webkit-user-drag: none;
        }


        /* =========================================
           CLICKABLE OFFER AREAS
           
           These are transparent buttons placed
           exactly over the three "Get Now" buttons.
        ========================================= */

        .offer-button {
            position: absolute;

            border: 0;
            outline: none;

            background: transparent;

            cursor: pointer;

            z-index: 10;

            border-radius: 20px;

            transition:
                background .2s ease,
                box-shadow .2s ease;
        }


        /*
           $5 BUTTON POSITION
           Based on your uploaded design
        */

        .offer-5 {
            left: 57.5%;
            top: 42.4%;

            width: 19%;
            height: 4.5%;
        }


        /*
           $10 BUTTON POSITION
        */

        .offer-10 {
            left: 57.5%;
            top: 58.3%;

            width: 19%;
            height: 4.5%;
        }


        /*
           $20 BUTTON POSITION
        */

        .offer-20 {
            left: 57.5%;
            top: 73.9%;

            width: 19%;
            height: 4.5%;
        }


        /* Hover effect */

        .offer-button:hover {
            background: rgba(255,255,255,0.08);

            box-shadow:
                0 0 18px rgba(0,220,255,0.35),
                inset 0 0 10px rgba(255,255,255,0.08);
        }


        .offer-button:active {
            transform: scale(.96);
        }


        /* =========================================
           OPTIONAL: INVISIBLE STATUS HOTSPOT
        ========================================= */

        .status-area {
            position: absolute;

            left: 43%;
            top: 22.2%;

            width: 52%;
            height: 5%;

            z-index: 5;

            pointer-events: none;
        }


        /* =========================================
           POPUP
        ========================================= */

        .popup {
            position: fixed;

            inset: 0;

            z-index: 999;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(0,0,0,.82);

            backdrop-filter: blur(8px);
        }


        .popup.active {
            display: flex;
        }


        .popup-box {
            width: min(420px, 92vw);

            padding: 30px;

            text-align: center;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    #07182b,
                    #030713
                );

            border: 1px solid #16d9ff;

            box-shadow:
                0 0 25px rgba(0,200,255,.35),
                0 0 70px rgba(0,100,255,.18);

            color: white;

            animation: popupIn .25s ease;
        }


        @keyframes popupIn {

            from {
                opacity: 0;
                transform: scale(.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }


        .popup-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }


        .popup-title {
            font-size: 27px;
            font-weight: 900;

            color: #20e7ff;

            margin-bottom: 12px;
        }


        .popup-text {
            color: #d8d8d8;

            line-height: 1.6;

            font-size: 15px;
        }


        .close-button {
            margin-top: 22px;

            border: 0;

            padding: 12px 28px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #00aeea,
                    #18ddff
                );

            color: white;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;
        }


        .close-button:hover {
            box-shadow:
                0 0 20px rgba(0,220,255,.45);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .website {
                padding: 0;
            }

            .poster {
                width: 100%;
            }

            .offer-button {
                border-radius: 12px;
            }

        }


        /* =========================================
           DESKTOP
        ========================================= */

        @media (min-width: 1025px) {

            .poster {
                margin: 20px 0;
                border-radius: 8px;

                box-shadow:
                    0 0 40px rgba(0,0,0,.7),
                    0 0 100px rgba(20,0,100,.2);
            }

        }

    </style>
</head>


<body>


    <main class="website">

        <section class="poster">

            <!--
                IMPORTANT:

                Rename your uploaded design to:

                design.png

                and keep it beside this index.html file.
            -->

            <img
                src="design.png"
                class="poster-image"
                alt="Cash Bonus Giveaway"
            >


            <!-- =====================================
                 $5 GET NOW
            ====================================== -->

            <button
                class="offer-button offer-5"
                aria-label="Claim $5 Cash Bonus"
                onclick="openBonus(5)"
            ></button>


            <!-- =====================================
                 $10 GET NOW
            ====================================== -->

            <button
                class="offer-button offer-10"
                aria-label="Claim $10 Cash Bonus"
                onclick="openBonus(10)"
            ></button>


            <!-- =====================================
                 $20 GET NOW
            ====================================== -->

            <button
                class="offer-button offer-20"
                aria-label="Claim $20 Cash Bonus"
                onclick="openBonus(20)"
            ></button>

        </section>

    </main>


    <!-- =========================================
         POPUP
    ========================================= -->

    <div
        class="popup"
        id="popup"
    >

        <div class="popup-box">

            <div class="popup-icon">
                💵
            </div>

            <div
                class="popup-title"
                id="popupTitle"
            >
                $5 Cash Bonus
            </div>

            <p class="popup-text">
                You selected the cash bonus offer.
                Connect this button to your own
                website page or backend here.
            </p>

            <button
                class="close-button"
                onclick="closeBonus()"
            >
                Continue
            </button>

        </div>

    </div>


    <script>

        /* =========================================
           OPEN BONUS
        ========================================= */

        function openBonus(amount) {

            document.getElementById("popupTitle").innerText =
                "$" + amount + " Cash Bonus";

            document
                .getElementById("popup")
                .classList.add("active");
        }


        /* =========================================
           CLOSE BONUS
        ========================================= */

        function closeBonus() {

            document
                .getElementById("popup")
                .classList.remove("active");
        }


        /* =========================================
           CLOSE WHEN CLICKING OUTSIDE
        ========================================= */

        document
            .getElementById("popup")
            .addEventListener("click", function(event) {

                if (event.target === this) {
                    closeBonus();
                }

            });


        /* =========================================
           ESC KEY
        ========================================= */

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeBonus();
            }

        });

    </script>

</body>
</html>
