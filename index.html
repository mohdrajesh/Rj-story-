<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Bonus Giveaway</title>

<!-- ================= CSS ================= -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Montserrat', sans-serif;
  overflow-x: hidden;
  text-align: center;
  color: #fff;
}

/* Animated background */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;

  background: linear-gradient(
    270deg,
    #00c6ff,
    #0072ff,
    #00ffd5,
    #ff7eb9,
    #ffca3a
  );

  background-size: 1000% 1000%;
  animation: flow 20s ease infinite;
}

@keyframes flow {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

/* Header */
.header {
  padding: 50px 20px 30px;
  text-shadow: 1px 2px 5px rgba(0,0,0,0.35);
}

.header h1 {
  margin: 0 0 12px;
  font-size: 45px;
  font-weight: 800;
}

.notice {
  color: #ffe066;
  font-size: 19px;
  font-weight: 700;
}

.online {
  font-size: 15px;
}

/* Cards */
.card-container {
  display: flex;
  justify-content: center;
  align-items: stretch;
  flex-wrap: wrap;
  gap: 20px;

  padding: 20px;
  max-width: 1000px;
  margin: auto;
}

.card {
  width: 280px;
  padding: 25px 20px;

  border-radius: 18px;
  color: #fff;

  background: linear-gradient(
    135deg,
    #ff7eb9,
    #ff758c,
    #ffb347,
    #00ffd5,
    #00c6ff
  );

  background-size: 400% 400%;
  animation: cardFlow 10s ease infinite;

  box-shadow: 0 10px 30px rgba(0,0,0,0.2);

  transition:
    transform 0.3s,
    box-shadow 0.3s;
}

@keyframes cardFlow {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 18px 40px rgba(0,0,0,0.35);
}

.card h2 {
  margin: 10px 0 15px;
  font-size: 28px;
}

.card p {
  font-size: 16px;
  margin-bottom: 22px;
}

/* Buttons */
.button {
  background: #fff;
  color: #0072ff;

  padding: 13px 28px;

  border: none;
  border-radius: 50px;

  cursor: pointer;

  font-size: 16px;
  font-weight: 700;

  transition: all 0.3s;
}

.button:hover {
  background: #0072ff;
  color: #fff;
  transform: scale(1.05);
}

/* Message */
#message {
  display: none;

  margin: 25px auto;
  padding: 15px 20px;

  max-width: 500px;

  border-radius: 12px;

  background: rgba(0,0,0,0.35);

  font-weight: 600;
}

/* Mobile */
@media (max-width: 600px) {

  .header {
    padding-top: 35px;
  }

  .header h1 {
    font-size: 32px;
  }

  .notice {
    font-size: 17px;
  }

  .card {
    width: 90%;
    max-width: 320px;
  }
}
</style>

</head>

<body>

<!-- ================= HTML ================= -->

<div class="header">

  <h1>💵 Cash Bonus Giveaway</h1>

  <p class="notice">
    Demo Giveaway
  </p>

  <p class="online">
    Users Online:
    <b id="onlineUsers">123</b>
    |
    Last Update: Aug 2026
  </p>

</div>


<div class="card-container">

  <div class="card">

    <h2>$5 Cash Bonus</h2>

    <p>
      Instant Wallet Credit
    </p>

    <button
      class="button"
      onclick="getBonus(5)">
      Get Now
    </button>

  </div>


  <div class="card">

    <h2>$10 Cash Bonus</h2>

    <p>
      Instant Wallet Credit
    </p>

    <button
      class="button"
      onclick="getBonus(10)">
      Get Now
    </button>

  </div>


  <div class="card">

    <h2>$20 Cash Bonus</h2>

    <p>
      Instant Wallet Credit
    </p>

    <button
      class="button"
      onclick="getBonus(20)">
      Get Now
    </button>

  </div>

</div>


<div id="message"></div>


<!-- ================= JAVASCRIPT ================= -->

<script>

function getBonus(amount) {

  const message =
    document.getElementById("message");

  message.style.display = "block";

  message.innerHTML =
    "You selected the $" +
    amount +
    " cash bonus.";

}


/* Demo online counter */

let users = 123;

setInterval(function() {

  const change =
    Math.random() > 0.5 ? 1 : -1;

  users += change;

  if (users < 100) {
    users = 100;
  }

  document.getElementById(
    "onlineUsers"
  ).textContent = users;

}, 3000);

</script>

</body>
</html>
