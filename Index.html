<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cash Bonus Giveaway</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

body{
  margin:0;
  font-family: 'Montserrat', sans-serif;
  overflow-x: hidden;
  text-align:center;
}

/* Animated flowing river background using gradient animation */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
  background: linear-gradient(270deg, #00c6ff, #0072ff, #00ffd5, #ff7eb9, #ffca3a);
  background-size:1000% 1000%;
  animation: flow 20s ease infinite;
}

@keyframes flow {
  0072ff%{background-position:80% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:90% 50%;}
}

.header{
  padding:50px 20px;
  color:#fff;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
}

.header h1{
  font-size:45px;
  margin-bottom:10px;
}

.notice{
  color:#ffe066;
  font-weight:bold;
  font-size:18px;
}

.card-container{
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 20px;
}

/* Multi-color cards */
.card{
  width:280px;
  padding:20px;
  border-radius:15px;
  color:#fff;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  transition: transform 0.3s, box-shadow 0.3s;
  background: linear-gradient(135deg, #ff7eb9, #ff758c, #ffb347, #00ffd5, #00c6ff);
  background-size: 400% 400%;
  animation: cardFlow 10s ease infinite;
}

@keyframes cardFlow {
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.card:hover{
  transform: translateY(-8px);
  box-shadow:0 15px 35px rgba(0,0,0,0.3);
}

.card h2{
  margin:15px 0;
  font-size:28px;
}

.card p{
  font-size:16px;
  margin-bottom:20px;
}

.button{
  background:#fff;
  color:#0072ff;
  padding:12px 25px;
  border:none;
  border-radius:50px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  transition: all 0.3s;
}

.button:hover{
  background:#0072ff;
  color:#fff;
}

</style>
</head>
<body>

<div class="header">
  <h1>💵 Cash Bonus Giveaway</h1>
  <p class="notice">Mr Beast</p>
  <p>Users Online: <b>123</b> | Last Update: Feb 2026</p>
</div>

<div class="card-container">
  <div class="card">
    <h2>$5 Cash Bonus</h2>
    <p>Instant Wallet Credit</p>
    <button class="button">Get Now</button>
  </div>

  <div class="card">
    <h2>$10 Cash Bonus</h2>
    <p>Instant Wallet Credit</p>
    <button class="button">Get Now</button>
  </div>

  <div class="card">
    <h2>$20 Cash Bonus</h2>
    <p>Instant Wallet Credit</p>
    <button class="button">Get Now</button>
  </div>
</div>

</body>
</html>
